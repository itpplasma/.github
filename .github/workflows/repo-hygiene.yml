name: Repository hygiene
on:
  workflow_call:
    inputs:
      hygiene-revision:
        description: Immutable revision of itpplasma/.github containing this workflow
        type: string
        required: true
permissions:
  contents: read
jobs:
  check:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    name: repo-hygiene
    # The self-hosted runners serve itpplasma; consumers in other organisations
    # run on GitHub's hosted runners.
    runs-on: ${{ github.repository_owner != 'itpplasma' && 'ubuntu-24.04' || (github.event.pull_request.head.repo.fork && fromJSON('["self-hosted","itp-ubuntu24"]') || fromJSON('["self-hosted", "itp-light"]')) }}
    timeout-minutes: 10
    steps:
      # Consumers need Git objects, never recursive submodule setup; the job's
      # read token lets private consumers be fetched as well.
      - name: Fetch the consumer at the exact tested revision
        env:
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$REPOSITORY.git"
          refs=("$HEAD")
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            refs+=("$BASE")
          fi
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            fetch --no-tags origin "${refs[@]}"
          GIT_LFS_SKIP_SMUDGE=1 git -c submodule.recurse=false checkout --detach "$HEAD"
      # A fork's parent history is published and outside the fork's control.
      - name: Fetch the parent repository of a fork
        env:
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          parent=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPOSITORY" |
            python3 -c 'import json, sys; print((json.load(sys.stdin).get("parent") or {}).get("full_name", ""))')
          if [ -n "$parent" ]; then
            git fetch --no-tags "https://github.com/$parent.git" '+refs/heads/*:refs/upstream/*'
          fi
      - uses: actions/checkout@v6
        with:
          repository: itpplasma/.github
          ref: ${{ inputs.hygiene-revision }}
          path: .hygiene-tools
          persist-credentials: false
      - name: Install pinned Gitleaks
        if: github.event.pull_request.head.repo.fork
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hygiene-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/hygiene-bin" gitleaks
          echo "$RUNNER_TEMP/hygiene-bin" >> "$GITHUB_PATH"
      - name: Test the shared gate
        if: github.repository == 'itpplasma/.github'
        run: python3 -m unittest discover -s .hygiene-tools/tests -v
      - name: Check every commit identity, added blob and secret in the PR range
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            BASE=$(git rev-parse "$HEAD^")
          fi
          upstream=()
          if git for-each-ref --count=1 --format=x refs/upstream/ | grep -q x; then
            upstream=(--upstream-ref 'refs/upstream/*')
          fi
          python3 .hygiene-tools/scripts/repo_hygiene.py --base "$BASE" --head "$HEAD" --github-repository "${{ github.repository }}" "${upstream[@]}"
