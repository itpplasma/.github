name: Owned Mac Python cache pilot
on:
  push:
    branches: [ci/owned-mac-python-pilot-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: [self-hosted, itp-macos]
    timeout-minutes: 8
    steps:
      - name: Set up native private CPython
        run: /opt/itp-ci-macos/setup-python.sh '${{ matrix.python }}' 
      - name: Verify native private Python and package installation
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PYTHON='${{ matrix.python }}' python - <<'PY' 
          import os, platform, sys
          print(sys.version)
          print(platform.machine(), sys.prefix)
          assert platform.machine() == 'arm64'
          assert '.'.join(map(str, sys.version_info[:2])) == os.environ['EXPECTED_PYTHON']
          assert sys.prefix.startswith(os.environ['HOME'] + '/')
          PY
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: numpy scipy pytest
          python -c 'import scipy, numpy; assert numpy.arange(5).sum() == 10; print(numpy.__version__)'
