name: Repository hygiene
on:
  pull_request:
  merge_group:
permissions:
  contents: read
# Only PR runs share a group; pending push and merge-group runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-hygiene:
    uses: itpplasma/.github/.github/workflows/repo-hygiene.yml@a30a3ec2f4592fdbb91445e773a07597ce2f1168
    with:
      hygiene-revision: a30a3ec2f4592fdbb91445e773a07597ce2f1168
